services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agent_orchestration
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "15673:5672" # AMQP (changed to avoid Windows port conflict)
      - "25672:15672" # Management UI (15672 is commonly reserved by Windows)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      # A worker holds a run's message until the run ends, and runs on real
      # projects take longer than the default 30 minutes; 6 h covers the
      # longest maxRunSeconds (4 h) plus setup.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 21600000"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
